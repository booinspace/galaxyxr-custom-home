name: Publish Black Home release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        default: v1.0.0
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check published assets
        run: |
          (cd prebuilt && sha256sum -c SHA256SUMS)
          python3 test_assets.py prebuilt/black-home.apk
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          prebuilt/black-home.apk prebuilt/SHA256SUMS
          --verify-tag --title "Black Home $RELEASE_TAG — Galaxy XR"
          --notes-file prebuilt/RELEASE.md
